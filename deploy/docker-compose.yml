# Homelab: docker compose -f deploy/docker-compose.yml up -d --build
services:
  gutter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      GUTTER_LIBRARY: /library
    volumes:
      - ${GUTTER_LIBRARY_HOST:-/srv/comics}:/library:ro
      - gutter-data:/data
      - gutter-cache:/cache
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gutter

volumes:
  gutter-data:
  gutter-cache:
  caddy-data:
